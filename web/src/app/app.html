<nav class="navbar bg-body-tertiary border-bottom mb-4">
  <div class="container app-container flex-wrap gap-2">
    <a class="navbar-brand fw-bold me-1" routerLink="/">
      <i class="fa-solid fa-book-open me-2 text-primary"></i>BookQuotes
    </a>

    <!-- Primary nav: always visible, also on mobile (no hamburger needed) -->
    @if (auth.isLoggedIn()) {
      <ul class="navbar-nav flex-row gap-1 me-auto">
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/books" routerLinkActive="active">
            <i class="fa-solid fa-book me-1"></i>Books
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-2" routerLink="/quotes" routerLinkActive="active">
            <i class="fa-solid fa-quote-right me-1"></i>Mina citat
          </a>
        </li>
      </ul>
    }

    <ul class="navbar-nav flex-row align-items-center gap-2 ms-auto">
      <li class="nav-item">
        <button class="btn btn-outline-secondary btn-sm" (click)="theme.toggle()"
                [title]="theme.theme() === 'light' ? 'Switch to dark' : 'Switch to light'">
          @if (theme.theme() === 'light') {
            <i class="fa-solid fa-moon"></i>
          } @else {
            <i class="fa-solid fa-sun"></i>
          }
        </button>
      </li>

      @if (auth.isLoggedIn()) {
        <li class="nav-item d-none d-sm-block">
          <span class="navbar-text">
            <i class="fa-solid fa-user me-1"></i>{{ auth.username() }}
          </span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-danger btn-sm" (click)="logout()" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i><span class="d-none d-sm-inline ms-1">Logout</span>
          </button>
        </li>
      } @else {
        <li class="nav-item">
          <a class="btn btn-outline-primary btn-sm" routerLink="/login">Log in</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-primary btn-sm" routerLink="/register">Register</a>
        </li>
      }
    </ul>
  </div>
</nav>

<main class="container app-container pb-5">
  <router-outlet />
</main>

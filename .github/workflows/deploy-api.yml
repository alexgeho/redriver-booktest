name: Deploy API to VPS

# Push to master -> SSH into the VPS -> pull the new code and rebuild the API
# container. Only runs when backend/deploy files change (frontend deploys via
# Vercel's own Git integration, so it is intentionally excluded here).
on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/deploy-api.yml"
  # Allow triggering a redeploy by hand from the Actions tab.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Optional: set VPS_SSH_PORT secret if SSH is not on 22.
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_REPO_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build api
            docker image prune -f
